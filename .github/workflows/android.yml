# 푸시와 풀 리퀘스트마다 단위 테스트(Compose 화면 테스트 포함)를 돌리고 debug APK를 빌드한다.
# 공공데이터 키는 쓰지 않는다(번들 샘플 데이터로만 테스트한다).
name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 캐시
        uses: gradle/actions/setup-gradle@v4

      # ubuntu-latest에는 Android SDK가 들어 있다(ANDROID_HOME). 필요한 플랫폼은 Gradle이 받는다.
      - name: 단위 테스트 + debug 빌드
        # gradlew에 실행 권한이 저장소에 기록돼 있지 않아(Windows에서 만듦) bash로 부른다.
        run: bash ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: 테스트 보고서 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
