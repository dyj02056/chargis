  <script>
    // 20칸 게이지: 5%씩. 목표(80%)까지 칸은 괘선 테두리, 나머지는 옅은 테두리.
    const gauge = document.getElementById("cut-gauge");
    const fills = [];
    for (let i = 0; i < 20; i++) {
      const cell = document.createElement("div");
      cell.className = "cut-cell";
      cell.style.left = i * 45.1 + "px";
      cell.style.border = i < 16 ? "3px solid #a19c93" : "2px solid #3b3833";
      const fill = document.createElement("div");
      fill.className = "cut-fill";
      cell.appendChild(fill);
      gauge.appendChild(cell);
      fills.push(fill);
    }
    const paint = (soc) => {
      fills.forEach((f, i) => { f.style.transform = "scaleX(" + Math.max(0, Math.min(1, (soc - i * 5) / 5)) + ")"; });
      document.getElementById("cut-soc").textContent = Math.floor(soc);
      document.getElementById("cut-elapsed").textContent = 38 + Math.floor(((soc - 38) / 8) * 2);
    };
    const state = { soc: 38 };
    paint(38);

    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#cut-inner", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power2.out" }, 0);
    tl.fromTo("#cut-cap-t", { opacity: 0 }, { opacity: 1, duration: 0.12 }, 0.2);
    // 38% -> 46%: 경과 시간이 40분에 닿는 순간 충전이 멈춘다.
    tl.fromTo(state, { soc: 38 }, { soc: 46, duration: 1.9, ease: "none", onUpdate: () => paint(state.soc) }, 0.3);
    tl.fromTo("#cut-state-on", { opacity: 1 }, { opacity: 0, duration: 0.08 }, 2.2);
    tl.fromTo("#cut-state-off", { opacity: 0 }, { opacity: 1, duration: 0.08 }, 2.2);
    tl.to(["#cut-soc-row", "#cut-gauge"], { opacity: 0.45, duration: 0.2, ease: "power2.out" }, 2.2);
    tl.fromTo("#cut-warn", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.45, ease: "power2.out" }, 2.3);
    // 블러 스왑으로 다음 장면에 넘긴다.
    tl.to("#cut-inner", { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power2.in" }, 3.82);
    window.__timelines["cutoff"] = tl;
  </script>
