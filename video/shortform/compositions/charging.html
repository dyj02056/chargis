    // 20칸 게이지: 5%씩. 목표(50%)까지 칸은 코발트 테두리, 나머지는 괘선 테두리.
    const gauge = document.getElementById("chg-gauge");
    const fills = [];
    for (let i = 0; i < 20; i++) {
      const cell = document.createElement("div");
      cell.className = "chg-cell";
      cell.style.left = i * 45.1 + "px";
      cell.style.border = i < 10 ? "3px solid #8fb2ee" : "2px solid #3b3833";
      const fill = document.createElement("div");
      fill.className = "chg-fill";
      cell.appendChild(fill);
      gauge.appendChild(cell);
      fills.push(fill);
    }
    const paint = (soc) => {
      fills.forEach((f, i) => { f.style.transform = "scaleX(" + Math.max(0, Math.min(1, (soc - i * 5) / 5)) + ")"; });
      const whole = Math.floor(soc);
      document.getElementById("chg-soc").textContent = whole;
      document.getElementById("chg-hdr-soc").textContent = whole + "%";
      const left = Math.ceil(((50 - soc) / 8) * 6);
      document.getElementById("chg-left").textContent = left;
      document.getElementById("chg-limit").textContent = 37 - (6 - left);
    };
    const state = { soc: 42 };
    paint(42);

    const tl = gsap.timeline({ paused: true });
    tl.fromTo("#chg-inner", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power2.out" }, 0);
    tl.fromTo("#chg-cap-t", { opacity: 0 }, { opacity: 1, duration: 0.12 }, 1.25);
    // 42% -> 50%: 숫자와 칸, 남은 시간이 함께 움직인다.
    tl.fromTo(state, { soc: 42 }, { soc: 50, duration: 1.9, ease: "none", onUpdate: () => paint(state.soc) }, 0.3);
    tl.fromTo("#chg-stamp", { opacity: 0, scale: 1.35, rotation: -6 }, { opacity: 1, duration: 0.09 }, 2.3);
    tl.to("#chg-stamp", { scale: 1, duration: 0.26, ease: "power3.out" }, 2.39);
    // 값이 위로 빠지며 다음 장면(제한 경고)의 값과 교체된다.
    tl.to(["#chg-title", "#chg-soc-row", "#chg-stamp", "#chg-gauge", "#chg-fields"],
      { y: -48, opacity: 0, duration: 0.2, stagger: 0.04, ease: "power3.in" }, 2.72);
